name: feastly
description: Premium Food Delivery Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^14.0.0

  # HTTP
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Design
  google_fonts: ^6.1.0
  iconsax: ^0.0.8
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  flutter_rating_bar: ^4.0.1
  pinput: ^3.0.1
  smooth_page_indicator: ^1.1.0
  flutter_slidable: ^3.1.0
  fl_chart: ^0.69.0
  dotted_border: ^2.1.0
  badges: ^3.1.2
  readmore: ^3.0.0
  timeline_tile: ^2.0.0
  step_progress_indicator: ^1.0.2
  flutter_staggered_animations: ^1.1.1
  skeletonizer: ^1.3.0
  share_plus: ^10.0.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  animated_bottom_navigation_bar: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
